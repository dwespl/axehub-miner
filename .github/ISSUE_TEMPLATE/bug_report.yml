name: Bug report
description: A crash, a backend that won't start, or a wrong/rejected result.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report — the fields below make an issue quick to reproduce.

        **Do not paste your wallet address, private keys, or pool password.** Redact them from any command or log you include.
  - type: input
    id: version
    attributes:
      label: Miner version
      description: From `axehub-miner --version`, or the release you downloaded.
      placeholder: "1.7.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - Hive OS
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU (or CPU)
      description: Model, plus driver version if you know it.
      placeholder: "e.g. RTX 4060 Ti, driver 560.xx — or CPU only"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - auto
        - cuda
        - opencl
        - vulkan
        - cpu
    validations:
      required: true
  - type: dropdown
    id: algo
    attributes:
      label: Algorithm
      options:
        - whirlpool
        - bc3hash
        - sha3-256t
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command / config
      description: How you started it (flags, or the relevant `axehub-miner.conf` lines). Redact wallet and password.
      render: shell
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected versus what actually happened. Does `--selftest` pass for this algorithm?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: The relevant lines from the console or log. Redact any wallet, worker name, or password.
      render: shell
